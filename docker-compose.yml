version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=false
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=UserDb;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
      - Keycloak__BaseUrl=http://bbu-auth-keycloak:8080
      - Keycloak__Realm=bbu
      - Keycloak__ClientId=user-service
      - Keycloak__ClientSecret=${KEYCLOAK_USER_SERVICE_SECRET}
    depends_on:
      - postgres
      - rabbitmq

  postgres:
    image: postgres:16-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: UserDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: user-service-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
